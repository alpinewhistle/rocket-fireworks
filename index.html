  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ht:100%;display:block\"><\u002Fcanvas>\n    <div style=\"position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,#0a0910 10%,rgba(10,9,16,0));pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:1280px;width:100%;margin:0 auto;display:grid;gap:28px\">\n      <div style=\"display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#ffb547\">\n        <span style=\"width:8px;height:8px;border-radius:50%;flex:none;background:{{ dotColor }};box-shadow:0 0 12px {{ dotColor }}\"><\u002Fspan>\n        <span>{{ seasonLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"margin:0 0 20px;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(88px,17vw,260px);line-height:0.95;letter-spacing:-0.01em;color:#fff\">Light up<br><span style=\"color:#ff4d2e\">Columbia<\u002Fspan><\u002Fh1>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px 56px;align-items:end\">\n        <p style=\"margin:0;font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:#cfc6bb;max-width:620px;text-wrap:pretty\">A family-run fireworks stand on Leesburg Road with a big selection and fair prices. Come pick out everything you need for <strong style=\"color:#fff;font-weight:600\">July 4th<\u002Fstrong> or <strong style=\"color:#fff;font-weight:600\">New Year’s Eve<\u002Fstrong>. Serving Columbia since 2017.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-start\">\n          <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=1604+Leesburg+Rd,+Columbia,+SC+29209\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#ff4d2e;color:#0a0910;font-weight:600;padding:16px 24px;border-radius:999px;font-size:16px\" style-hover=\"background:#fff;color:#0a0910\">Get direct "font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#8d8478\">Call or email<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;font-size:16px;line-height:1.45\">\n          <a href=\"tel:8032001144\" style=\"color:#efe9e1\" style-hover=\"color:#ffb547\">803-200-1144<\u002Fa>\n          <a href=\"mailto:RocketFireworksLLC@gmail.com\" style=\"color:#efe9e1;overflow-wrap:anywhere\" style-hover=\"color:#ffb547\">RocketFireworksLLC@gmail.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:6px;align-content:start\">\n        <span style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#8d8478\">Age requirement<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.45\">16+ to purchase, per South Carolina law.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section data-screen-label=\"Locally owned\" style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;gap:clamp(40px,5vw,72px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 96px;align-items:end\">\n      <div style=\"display:grid;gap:24px\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#ffb547\">Family-owned since 2017<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,6vw,84px);line-height:1;color:#fff;text-wrap:balance\">Locally owned in Columbia<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.65;color:#cfc6bb;text-wrap:pretty\">We’re a family business, so buying from us keeps your money in the community. We keep our prices fair and are happy to help you put together a show that fits your budget.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px\">\n      <div style=\"aspect-ratio:3/2\"><image-slot id=\"photo-stand\" shape=\"rounded\" radius=\"6\" placeholder=\"Photo of the stand\" src=\"https://www.rocketfireworksllc.com/wp-content/uploads/Rocket-Fireworks-Stand.jpg\"><\u002Fimage-slot><\u002Fdiv>\n      <div style=\"aspect-ratio:3/2\"><image-slot id=\"photo-selection\" shape=\"rounded\" radius=\"6\" placeholder=\"Photo of the family\" src=\"https://www.rocketfireworksllc.com/wp-content/uploads/Family-Rocket-Fireworks.jpg\"><\u002Fimage-slot><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"selection\" data-screen-label=\"Selection\" style=\"background:#f4eee6;color:#0a0910\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;gap:56px\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 96px;align-items:end\">\n        <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,6vw,84px);line-height:1;text-wrap:balance\">Build your own show<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.65;color:#3d3833;text-wrap:pretty\">Instead of buying a pre-packed assortment, pick out exactly what you want from our full inventory. If you’re not sure where to start, just ask and we’ll share our favorites.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:16px\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#7a7067\">What you’ll find at the stand<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border-top:2px solid #0a0910\">\n          <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"padding:28px 24px 28px 0;display:grid;gap:14px;border-bottom:1px solid rgba(10,9,16,0.15)\">\n              <span style=\"font-family:'Anton',sans-serif;font-weight:400;font-size:20px;color:#d63a1c\">{{ c.num }}<\u002Fspan>\n              <h3 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:36px;line-height:1\">{{ c.title }}<\u002Fh3>\n              <p style=\"margin:0;font-size:17px;line-height:1.5;color:#3d3833\">{{ c.items }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:17px;line-height:1.5;color:#3d3833\"><strong style=\"color:#0a0910;font-weight:600\">Brands we carry include<\u002Fstrong> Brothers Pyrotechnics, Winda, Black Cat, and Dominator.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"events\" data-screen-label=\"Events\" style=\"background:#ffb547;color:#0a0910\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,7vw,96px) clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px 96px;align-items:center\">\n      <div style=\"display:grid;gap:20px\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase\">Year-round, by appointment<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,5vw,72px);line-height:1;text-wrap:balance\">Weddings, company events &amp; celebrations<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:24px\">\n        <p style=\"margin:0;font-size:18px;line-height:1.6;text-wrap:pretty\">The stand is open to the public twice a year, but you can contact us any time about fireworks for a wedding, company event, or private celebration. Let us know the date and we’ll set up a time for you to shop.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <a href=\"#visit\" style=\"display:inline-flex;align-items:center;background:#0a0910;color:#fff;font-weight:600;padding:16px 24px;border-radius:999px;font-size:16px\" style-hover=\"background:#ff4d2e;color:#0a0910\">Send an inquiry<\u002Fa>\n          <a href=\"tel:8032001144\" style=\"display:inline-flex;align-items:center;border:1.5px solid #0a0910;color:#0a0910;font-weight:600;padding:16px 24px;border-radius:999px;font-size:16px\" style-hover=\"background:#0a0910;color:#fff\">Call 803-200-1144<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" data-screen-label=\"FAQ\" style=\"background:#f4eee6;color:#0a0910\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:40px 96px;align-items:start\">\n      <div style=\"display:grid;gap:24px\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#7a7067\">Before you visit<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,6vw,84px);line-height:1\">Common questions<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;border-top:2px solid #0a0910\">\n        <sc-for list=\"{{ faqs }}\" as=\"f\" hint-placeholder-count=\"7\">\n          <div style=\"border-bottom:1px solid rgba(10,9,16,0.15)\">\n            <button sc-camel-on-click=\"{{ f.toggle }}\" style=\"width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;background:none;border:none;padding:22px 0;color:#0a0910;font:inherit;font-size:18px;font-weight:600;line-height:1.4;text-align:left;cursor:pointer\" style-hover=\"color:#d63a1c\">\n              <span>{{ f.q }}<\u002Fspan>\n              <span style=\"flex:none;font-size:24px;font-weight:400;color:#d63a1c;line-height:1\">{{ f.icon }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ f.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;padding:0 48px 24px 0;font-size:16px;line-height:1.6;color:#3d3833;text-wrap:pretty\">{{ f.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"safety\" data-screen-label=\"Safety\" style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;gap:40px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px 96px;align-items:end\">\n      <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,6vw,84px);line-height:1;color:#fff\">Shoot safe<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.65;color:#cfc6bb;text-wrap:pretty\">These tips come from the South Carolina State Fire Marshal. Please read them before you light anything.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ tipCols }};gap:1px;background:rgba(239,233,225,0.12);border:1px solid rgba(239,233,225,0.12);border-radius:8px;overflow:hidden\">\n      <sc-for list=\"{{ tips }}\" as=\"t\" hint-placeholder-count=\"10\">\n        <div style=\"background:#0a0910;padding:22px;display:grid;gap:10px;align-content:start\">\n          <span style=\"font-family:'Anton',sans-serif;font-size:28px;line-height:1;color:#ff4d2e\">{{ t.num }}<\u002Fspan>\n          <span style=\"font-size:16px;font-weight:600;color:#fff;line-height:1.4\">{{ t.title }}<\u002Fspan>\n          <sc-if value=\"{{ showTipDetails }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:15px;line-height:1.55;color:#a89f94\">{{ t.body }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <button sc-camel-on-click=\"{{ toggleTips }}\" style=\"display:inline-flex;align-items:center;background:transparent;border:1px solid rgba(239,233,225,0.3);color:#efe9e1;font:inherit;font-weight:500;font-size:16px;padding:14px 22px;border-radius:999px;cursor:pointer\" style-hover=\"border-color:#ffb547;color:#ffb547\">{{ tipsLabel }}<\u002Fbutton>\n      <a href=\"https://www.cpsc.gov/Safety-Education/Safety-Education-Centers/Fireworks\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"display:inline-flex;align-items:center;color:#a89f94;font-weight:500;font-size:16px;padding:14px 8px\" style-hover=\"color:#ffb547\">More from the CPSC ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"visit\" data-screen-label=\"Contact\" style=\"background:#ff4d2e;color:#0a0910\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(72px,10vw,140px) clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px 96px\">\n      <div style=\"display:grid;gap:28px;align-content:start\">\n        <h2 style=\"margin:0;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(56px,7vw,104px);line-height:0.98\">Visit the stand<\u002Fh2>\n        <p style=\"margin:0;font-size:18px;line-height:1.6;text-wrap:pretty\">We’re a seasonal stand at 1604 Leesburg Road in Columbia, open to the public the weeks leading up to July 4th and New Year’s Eve. The rest of the year, we’re available by appointment for special events.<\u002Fp>\n        <div style=\"display:grid;gap:4px;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,3vw,40px);line-height:1.1\">\n          <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=1604+Leesburg+Rd,+Columbia,+SC+29209\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"color:#0a0910\" style-hover=\"color:#fff\">1604 Leesburg Rd, Columbia, SC 29209 ↗<\u002Fa>\n          <a href=\"tel:8032001144\" style=\"color:#0a0910\" style-hover=\"color:#fff\">803-200-1144<\u002Fa>\n          <a href=\"mailto:RocketFireworksLLC@gmail.com\" style=\"color:#0a0910;font-size:0.7em;text-transform:none;font-weight:700;overflow-wrap:anywhere\" style-hover=\"color:#fff\">RocketFireworksLLC@gmail.com<\u002Fa>\n        <\u002Fdiv>\n        <sc-if value=\"{{ notMobile }}\" hint-placeholder-val=\"{{ true }}\">\n          <iframe title=\"Map to Rocket Fireworks\" src=\"https://www.google.com/maps?q=1604+Leesburg+Rd,+Columbia,+SC+29209&amp;output=embed\" loading=\"lazy\" style=\"width:100%;aspect-ratio:16/10;border:0;border-radius:8px;display:block;background:#0a0910;filter:grayscale(0.3) contrast(1.05)\"><\u002Fiframe>\n        <\u002Fsc-if>\n        <p style=\"margin:0;font-size:16px;line-height:1.6\">Follow us on <a href=\"https://www.facebook.com/rocketfireworksllc/\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"color:#0a0910;text-decoration:underline;font-weight:600\" style-hover=\"color:#fff\">Facebook<\u002Fa> for opening dates and deals.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#0a0910;color:#efe9e1;border-radius:8px;padding:clamp(24px,3vw,40px);display:grid;gap:20px;align-content:start;align-self:start\">\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;gap:12px;padding:24px 0\">\n            <span style=\"font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:40px;color:#ffb547\">Thanks!<\u002Fspan>\n            <span style=\"font-size:16px;line-height:1.55;color:#cfc6bb\">{{ sentMessage }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;gap:20px\">\n            <span style=\"font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#ffb547\">Send us a message<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:16px\">\n              <label style=\"display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;font-size:13px;color:#a89f94\">First name *<input value=\"{{ first }}\" sc-camel-on-change=\"{{ setFirst }}\" style=\"width:100%;min-width:0;font:inherit;font-size:16px;color:#fff;background:#17141f;border:1px solid rgba(239,233,225,0.15);border-radius:6px;padding:14px;outline:none\" style-focus=\"border-color:#ffb547\"><\u002Flabel>\n              <label style=\"display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;font-size:13px;color:#a89f94\">Last name<input value=\"{{ last }}\" sc-camel-on-change=\"{{ setLast }}\" style=\"width:100%;min-width:0;font:inherit;font-size:16px;color:#fff;background:#17141f;border:1px solid rgba(239,233,225,0.15);border-radius:6px;padding:14px;outline:none\" style-focus=\"border-color:#ffb547\"><\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;font-size:13px;color:#a89f94\">Email *<input type=\"email\" value=\"{{ email }}\" sc-camel-on-change=\"{{ setEmail }}\" style=\"width:100%;min-width:0;font:inherit;font-size:16px;color:#fff;background:#17141f;border:1px solid rgba(239,233,225,0.15);border-radius:6px;padding:14px;outline:none\" style-focus=\"border-color:#ffb547\"><\u002Flabel>\n            <label style=\"display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;font-size:13px;color:#a89f94\">Message<textarea placeholder=\"Event date, what you’re planning, or any questions\" rows=\"5\" value=\"{{ message }}\" sc-camel-on-change=\"{{ setMessage }}\" style=\"width:100%;min-width:0;font:inherit;font-size:16px;color:#fff;background:#17141f;border:1px solid rgba(239,233,225,0.15);border-radius:6px;padding:14px;outline:none;resize:vertical\" style-focus=\"border-color:#ffb547\"><\u002Ftextarea><\u002Flabel>\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:14px;color:#ff8a70\">{{ errorText }}<\u002Fspan>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ submit }}\" disabled=\"{{ sending }}\" style=\"justify-self:start;background:#ff4d2e;color:#0a0910;border:none;font:inherit;font-weight:600;font-size:16px;padding:16px 28px;border-radius:999px;cursor:pointer\" style-hover=\"background:#ffb547\">{{ submitLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n        <iframe title=\"Map to Rocket Fireworks\" src=\"https://www.google.com/maps?q=1604+Leesburg+Rd,+Columbia,+SC+29209&amp;output=embed\" loading=\"lazy\" style=\"width:100%;aspect-ratio:16/10;border:0;border-radius:8px;display:block;background:#0a0910;filter:grayscale(0.3) contrast(1.05)\"><\u002Fiframe>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"max-width:1280px;margin:0 auto;padding:40px clamp(20px,4vw,56px) {{ footerPad }};display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;font-size:14px;color:#8d8478\">\n    <img src=\"cb0acbb4-91f3-4095-b77a-93a26a1c84bf\" alt=\"Rocket Fireworks LLC\" style=\"height:64px;width:64px;display:block\">\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <a href=\"https://www.facebook.com/rocketfireworksllc/\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"color:#8d8478\" style-hover=\"color:#ffb547\">Facebook<\u002Fa>\n      <span>© Rocket Fireworks LLC · Family-owned since 2017<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:12px;right:12px;bottom:12px;z-index:6;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;background:rgba(10,9,16,0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(239,233,225,0.15);border-radius:999px\">\n      <a href=\"tel:8032001144\" style=\"display:flex;align-items:center;justify-content:center;min-height:48px;background:#ffb547;color:#0a0910;font-weight:600;font-size:16px;border-radius:999px\">Call<\u002Fa>\n      <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=1604+Leesburg+Rd,+Columbia,+SC+29209\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ openExternal }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:48px;background:#ff4d2e;color:#0a0910;font-weight:600;font-size:16px;border-radius:999px\">Directions<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;season&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Off-season&quot;,&quot;July 4th&quot;,&quot;New Year's Eve&quot;],&quot;default&quot;:&quot;Off-season&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Season&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contact form&quot;}}\">\nclass Component extends DCLogic {\n  state = { showTipDetails: false, scrolled: false, isMobile: false, openFaq: 0, first: '', last: '', email: '', message: '', sent: false, sending: false, error: '' };\n  canvasRef = React.createRef();\n\n  componentDidMount() {\n    document.documentElement.style.scrollBehavior = 'smooth';\n    this._onScroll = () => { const s = scrollY > 40; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };\n    addEventListener('scroll', this._onScroll, { passive: true });\n    this._mq = matchMedia('(max-width: 720px)');\n    this._onMq = () => this.setState({ isMobile: this._mq.matches });\n    this._onMq(); this._mq.addEventListener('change', this._onMq);\n    cancelAnimationFrame(this._raf);\n    const c = this.canvasRef.current; if (!c) return;\n    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    this._visible = true;\n    this._io = new IntersectionObserver(([e]) => { this._visible = e.isIntersecting; }); this._io.observe(c);\n    const ctx = c.getContext('2d');\n    const colors = ['#ff4d2e', '#ffb547', '#ffffff', '#6fa8ff', '#ff7ab6'];\n    let rockets = [], sparks = [], w = 0, h = 0, dpr = Math.min(devicePixelRatio || 1, 2), last = 0;\n    const resize = () => { w = c.clientWidth; h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };\n    resize(); this._onResize = resize; addEventListener('resize', resize);\n    const launch = () => rockets.push({ x: w * (0.15 + Math.random() * 0.7), y: h, vy: -(h * 0.011 + Math.random() * h * 0.004), ty: h * (0.12 + Math.random() * 0.35), col: colors[(Math.random() * colors.length) | 0] });\n    const burst = (r) => {\n      const n = 70 + (Math.random() * 50 | 0), sp = 2 + Math.random() * 2.5;\n      for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, v = sp * (0.6 + Math.random() * 0.4); sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: Math.random() < 0.2 ? '#fff' : r.col }); }\n    };\n    let prev = 0;\n    const tick = (t) => {\n      this._raf = requestAnimationFrame(tick);\n      const k = prev ? Math.min((t - prev) / (1000 / 60), 3) : 1; prev = t;\n      if (!this._visible || document.hidden) return;\n      ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = `rgba(0,0,0,${1 - Math.pow(0.82, k)})`; ctx.fillRect(0, 0, w, h);\n      ctx.globalCompositeOperation = 'lighter';\n      if (t - last > 900 + Math.random() * 600) { launch(); last = t; }\n      rockets = rockets.filter(r => { r.y += r.vy * k; r.vy *= Math.pow(0.985, k); ctx.fillStyle = '#ffd9a0'; ctx.fillRect(r.x - 1, r.y, 2, 6); if (r.y <= r.ty || r.vy > -1.5) { burst(r); return false; } return true; });\n      sparks = sparks.filter(s => { s.x += s.vx * k; s.y += s.vy * k; s.vy += 0.035 * k; s.vx *= Math.pow(0.98, k); s.vy *= Math.pow(0.98, k); s.life -= 0.012 * k; ctx.globalAlpha = Math.max(s.life, 0); ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(s.x, s.y, 1.6, 0, 7); ctx.fill(); return s.life > 0; });\n      ctx.globalAlpha = 1;\n    };\n    launch(); this._raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf); removeEventListener('resize', this._onResize); removeEventListener('scroll', this._onScroll);\n    this._mq && this._mq.removeEventListener('change', this._onMq); this._io && this._io.disconnect();\n  }\n\n  submit = async () => {\n    const { first, last, email, message } = this.state;\n    if (!first.trim() || !email.trim()) return this.setState({ error: 'Please add your first name and email.' });\n    const endpoint = (this.props.formEndpoint || '').trim();\n    if (!endpoint) {\n      const body = encodeURIComponent(`${message}\\n\\n— ${first} ${last}\\n${email}`);\n      window.location.href = `mailto:RocketFireworksLLC@gmail.com?subject=${encodeURIComponent('Website inquiry from ' + first)}&body=${body}`;\n      return this.setState({ sent: true, error: '' });\n    }\n    this.setState({ sending: true, error: '' });\n    try {\n      const r = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ name: `${first} ${last}`.trim(), email, message }) });\n      if (!r.ok) throw new Error();\n      this.setState({ sent: true, sending: false });\n    } catch (e) {\n      this.setState({ sending: false, error: 'Something went wrong. Please call us at 803-200-1144.' });\n    }\n  };\n\n  renderVals() {\n    const s = this.state, p = this.props, set = k => e => this.setState({ [k]: e.target.value });\n    const season = p.season ?? 'Off-season';\n    const labels = {\n      'July 4th': 'Now open for July 4th · Call for today’s hours',\n      \"New Year's Eve\": 'Now open for New Year’s Eve · Call for today’s hours',\n      'Off-season': 'Open before July 4th & New Year’s Eve · Columbia, SC',\n    };\n    const faqData = [\n      ['What forms of payment do you take?', 'We accept cash, credit cards, and debit cards.'],\n      ['Is there parking?', 'Yes, there’s parking on site.'],\n      ['Can I call ahead for a big order?', 'Yes. Call 803-200-1144 and we can have your order pulled and ready when you arrive.'],\n      ['Can I return unused fireworks?', 'All sales are final, so we’re happy to help you choose before you buy.'],\n      ['How old do I have to be to buy fireworks?', 'South Carolina law requires you to be at least 16 years old to purchase fireworks.'],\n      ['Are fireworks legal where I live?', 'Rules vary by county and city, and some neighborhoods have their own restrictions. Check with your local officials before you buy.'],\n      ['How do I find out when you’re open?', 'Follow us on Facebook. That’s where we post opening dates and any specials during the season.'],\n    ];\n    return {\n      seasonLabel: labels[season] || labels['Off-season'],\n      \n      dotColor: season === 'Off-season' ? '#8d8478' : '#3ddc84',\n      headerBg: s.scrolled ? 'rgba(10,9,16,0.85)' : 'linear-gradient(to bottom, rgba(10,9,16,0.75), rgba(10,9,16,0))',\n      isMobile: s.isMobile, notMobile: !s.isMobile, footerPad: s.isMobile ? '104px' : '40px',\n      canvasRef: this.canvasRef,\n      categories: [\n        { num: '01', title: 'Family Favorites', items: 'Sparklers, smoke bombs, and ground spinners' },\n        { num: '02', title: 'Classic Displays', items: 'Vibrant fountains and traditional Roman candles' },\n        { num: '03', title: 'Heavy Hitters', items: 'High-flying aerial repeaters (cakes), mortars, and artillery shells' },\n      ],\n      faqs: faqData.map(([q, a], i) => ({ q, a, open: s.openFaq === i, icon: s.openFaq === i ? '−' : '+', toggle: () => this.setState({ openFaq: s.openFaq === i ? -1 : i }) })),\n      t
